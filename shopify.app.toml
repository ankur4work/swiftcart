# SwiftCart — Shopify app configuration
# https://shopify.dev/docs/apps/tools/cli/configuration
#
# client_id must stay in agreement with lib/shopify/app-identity.ts and the
# SHOPIFY_API_KEY in the deployed environment — /api/health/strict compares all
# three and returns 503 on a mismatch, which fails the deploy and rolls it back.
# That is deliberate: a container pointed at the wrong app authenticates nobody
# and shows merchants a blank embedded screen with nothing in the logs.

client_id = "b933b83ab9f7c6c531cf0859d40f247d"
name = "SwiftCart"
# App handles are globally unique across Shopify, and plain "swiftcart" is
# already taken — the deploy is rejected with "App handle must be unique".
# This handle is user-visible: it addresses the hosted plan page at
# /store/:store/charges/:app_handle/pricing_plans, so it must also match
# SHOPIFY_APP_HANDLE in the environment.
handle = "swiftcart-live"
application_url = "https://swiftcart.live"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
# EMPTY, and that is correct — SwiftCart requests no Admin API permissions at
# all. The merchant sees no permission prompt at install.
#
# The cart bar renders entirely from Liquid and the Ajax Cart API, so it needs
# no product, order or cart-transform access. The only thing the app writes is
# its entitlement flag, and that is an app-data metafield on the app's own
# installation, which needs no scope (lib/shopify/metafields.ts explains why).
#
# This previously read "write_metafields". That scope does not exist — Shopify
# rejects it at deploy with "These scopes are invalid" — because metafield
# access is granted through the owner resource, not by a metafield scope.
#
# Do not add a scope here without a concrete need: every one is a permission
# the merchant must accept and a question App Store review will ask.
scopes = ""
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://swiftcart.live/api/auth/callback"
]

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/webhooks/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/api/webhooks/app-subscriptions-update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/api/webhooks/customers-data-request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/api/webhooks/customers-redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/api/webhooks/shop-redact"

# Storefront fallback for the entitlement check. The theme extension reads the
# shop metafield first and only calls this when the metafield is missing (fresh
# install, or a metafield write that hasn't landed yet).
[app_proxy]
url = "https://swiftcart.live/api/proxy"
subpath = "swiftcart"
prefix = "apps"

[pos]
embedded = false
